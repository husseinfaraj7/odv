# =========================================================
# 🔧 SERVER CONFIGURATION
# =========================================================
server.port=0
server.error.include-message=always
server.error.include-binding-errors=always

# =========================================================
# 🗄️ DATABASE CONFIGURATION (H2 for testing)
# =========================================================
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.connection.useUnicode=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# =========================================================
# 🏊 HIKARICP CONNECTION POOL
# =========================================================
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# =========================================================
# 🧰 H2 CONSOLE (for debugging, optional)
# =========================================================
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# =========================================================
# 📧 EMAIL CONFIGURATION (MOCKED FOR TESTS)
# =========================================================
spring.mail.host=localhost
spring.mail.port=2525
spring.mail.username=test
spring.mail.password=test
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# Disable real Brevo/Supabase usage in test profile
brevo.api.key=dummy-key
brevo.sender.email=noreply@test.local
brevo.sender.name=ODV Test
brevo.admin.email=admin@test.local

supabase.url=http://localhost:9999
supabase.anon.key=dummy
supabase.service.role.key=dummy

# =========================================================
# 🌐 APPLICATION CONFIGURATION
# =========================================================
app.frontend.url=http://localhost:3000

# =========================================================
# 📊 ACTUATOR ENDPOINTS
# =========================================================
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=when-authorized

# =========================================================
# 🪵 LOGGING
# =========================================================
logging.level.root=INFO
logging.level.it.odvsicilia.backend=DEBUG
logging.level.org.hibernate.SQL=INFO
logging.level.org.hibernate.type.descriptor.sql=TRACE
logging.level.com.zaxxer.hikari=INFO
logging.level.org.springframework.mail=INFO
