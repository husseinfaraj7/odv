# ============================================
# PRODUCTION CONFIGURATION
# ============================================
# 
# REQUIRED ENVIRONMENT VARIABLES:
# - DATABASE_URL - PostgreSQL connection URL (any format, will be converted to JDBC by DatabaseUrlEnvironmentPostProcessor)
# - DATABASE_USER - PostgreSQL username (optional if included in DATABASE_URL query params)
# - DATABASE_PASSWORD - PostgreSQL password (optional if included in DATABASE_URL query params)
# - BREVO_SMTP_USERNAME - Brevo SMTP username for email sending
# - BREVO_API_KEY - Brevo API key for email authentication
#
# OPTIONAL ENVIRONMENT VARIABLES:
# - SPRING_JPA_HIBERNATE_DDL_AUTO - Schema management: 'update' (auto-migrate) or 'validate' (no changes)
# - ADMIN_EMAIL - Email address for admin notifications (default: ussofaraj@gmail.com)
# - CORS_ALLOWED_ORIGINS - Comma-separated list of allowed origins
#
# CREDENTIAL PRECEDENCE:
# 1. Explicit DATABASE_USER/DATABASE_PASSWORD environment variables (highest priority)
# 2. Query parameters in JDBC URL (e.g., ?user=xxx&password=xxx) (fallback)
# ============================================

# ============================================
# DATABASE CONFIGURATION (Supabase PostgreSQL)
# ============================================
# DATABASE_URL is converted to JDBC format by DatabaseUrlEnvironmentPostProcessor
# No local conversion logic needed - just reference the converted URL
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://${DATABASE_HOST:db.YOUR_PROJECT_REF.supabase.co}:${DATABASE_PORT:6543}/${DATABASE_NAME:postgres}?sslmode=require}
spring.datasource.username=${DATABASE_USER:#{systemProperties['jdbc.user'] ?: systemProperties['jdbc.username'] ?: ''}}
spring.datasource.password=${DATABASE_PASSWORD:#{systemProperties['jdbc.password'] ?: ''}}

# ============================================
# HIKARI CONNECTION POOL (Production Overrides)
# ============================================
# Optimized for Supabase transaction pooler mode (port 6543)
# Transaction pooler benefits from smaller connection pools
# as it handles multiplexing multiple client connections efficiently
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.leak-detection-threshold=60000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.initialization-fail-timeout=60000
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.test-on-borrow=true
spring.datasource.hikari.jdbc-url=${DATABASE_URL:jdbc:postgresql://${DATABASE_HOST:db.YOUR_PROJECT_REF.supabase.co}:${DATABASE_PORT:6543}/${DATABASE_NAME:postgres}?sslmode=require}
spring.datasource.continue-on-error=false

# ============================================
# JPA AND HIBERNATE CONFIGURATION (Production Overrides)
# ============================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.connection.characterEncoding=utf8

# ============================================
# EMAIL CONFIGURATION (Production Overrides)
# ============================================
spring.mail.host=${SMTP_HOST:smtp-relay.brevo.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${BREVO_SMTP_USERNAME}
spring.mail.password=${BREVO_API_KEY}
spring.mail.properties.mail.smtp.ssl.trust=smtp-relay.brevo.com

# Brevo API Configuration
brevo.api.key=${BREVO_API_KEY}

# Admin email for notifications
admin.email=${ADMIN_EMAIL:ussofaraj@gmail.com}

# ============================================
# CORS CONFIGURATION
# ============================================
cors.allowed.origins=${CORS_ALLOWED_ORIGINS:https://odvsicilia.it,https://www.odvsicilia.it,https://oliodivaleria.it,https://www.oliodivaleria.it}

# ============================================
# SECURITY
# ============================================
spring.h2.console.enabled=false

# ============================================
# LOGGING (Production Overrides)
# ============================================
logging.level.root=INFO
logging.level.it.odvsicilia.backend=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN
logging.level.org.springframework.mail=INFO
logging.level.com.zaxxer.hikari=INFO
logging.level.org.springframework.boot.autoconfigure.jdbc=INFO
