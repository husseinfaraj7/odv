# ============================================
# PRODUCTION CONFIGURATION
# ============================================

# ============================================
# DATABASE CONFIGURATION (Supabase PostgreSQL)
# ============================================
spring.datasource.url=jdbc:postgresql://${DATABASE_HOST:db.pejuystijjkjxjctieyb.supabase.co}:${DATABASE_PORT:5432}/${DATABASE_NAME:postgres}?sslmode=require
spring.datasource.username=${DATABASE_USER:postgres}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ============================================
# HIKARI CONNECTION POOL
# ============================================
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.leak-detection-threshold=60000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.initialization-fail-timeout=1

# ============================================
# JPA AND HIBERNATE CONFIGURATION
# ============================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.connection.characterEncoding=utf8
spring.jpa.properties.hibernate.connection.useUnicode=true

# Hibernate will auto-detect PostgreSQL dialect

# ============================================
# EMAIL CONFIGURATION (Brevo SMTP)
# ============================================
spring.mail.host=${SMTP_HOST:smtp-relay.brevo.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME}
spring.mail.password=${SMTP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp-relay.brevo.com

# Admin email for notifications
admin.email=${ADMIN_EMAIL:ussofaraj@gmail.com}

# ============================================
# CORS CONFIGURATION
# ============================================
cors.allowed.origins=${CORS_ALLOWED_ORIGINS:https://odvsicilia.it,https://www.odvsicilia.it,https://oliodivaleria.it,https://www.oliodivaleria.it}

# ============================================
# SECURITY
# ============================================
spring.h2.console.enabled=false

# ============================================
# LOGGING
# ============================================
logging.level.root=INFO
logging.level.it.odvsicilia.backend=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN
