      # Session pooler (Port 5432):
      #   postgresql://postgres.xyz789:SecretP@ss@aws-0-us-east-1.pooler.supabase.com:5432/postgres
      #   postgresql://postgres.xyz789:SecretP@ss@aws-1-us-east-1.pooler.supabase.com:5432/postgres
      #   
      #   Hostname only: aws-0-us-east-1.pooler.supabase.com
      #   Hostname only: aws-1-us-east-1.pooler.supabase.com
      # 
      # Direct connection (Port 5432) - NOT recommended for Render:
      #   postgresql://postgres.xyz789:SecretP@ss@db.xyz789.supabase.co:5432/postgres
