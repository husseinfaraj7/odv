      # 3. Test API endpoint: https://your-app.onrender.com/actuator/health
      # 4. If still failing, review STEP 1 again with the new error message
      #
      # ============================================================================
      # REGIONAL DATABASE_URL EXAMPLES
      # ============================================================================
      #
      # Choose the URL format based on your Supabase project region.
