      #   Hostname only: db.xyz789.supabase.co
      #
      # ASIA PACIFIC - Southeast 1 (Singapore) [ap-southeast-1]
      # ────────────────────────────────────────────────────────────────────────
      # Transaction pooler (Port 6543) - ⭐ RECOMMENDED for production:
      #   postgresql://postgres.def456:P@ssword123@aws-0-ap-southeast-1.pooler.supabase.com:6543/postgres
      #   postgresql://postgres.def456:P@ssword123@aws-1-ap-southeast-1.pooler.supabase.com:6543/postgres
      #   
      #   Hostname only: aws-0-ap-southeast-1.pooler.supabase.com
      #   Hostname only: aws-1-ap-southeast-1.pooler.supabase.com
      # 
      # Session pooler (Port 5432):
      #   postgresql://postgres.def456:P@ssword123@aws-0-ap-southeast-1.pooler.supabase.com:5432/postgres
      #   postgresql://postgres.def456:P@ssword123@aws-1-ap-southeast-1.pooler.supabase.com:5432/postgres
      #   
      #   Hostname only: aws-0-ap-southeast-1.pooler.supabase.com
      #   Hostname only: aws-1-ap-southeast-1.pooler.supabase.com
      # 
      # Direct connection (Port 5432) - NOT recommended for Render:
      #   postgresql://postgres.def456:P@ssword123@db.def456.supabase.co:5432/postgres
      #   
      #   Hostname only: db.def456.supabase.co
      #
      # Additional Supabase regions (use same pattern):
      # ────────────────────────────────────────────────────────────────────────
      # - us-west-1 (N. California)
      # - eu-central-1 (Frankfurt)
      # - eu-west-1 (Ireland)
      # - eu-west-2 (London)
      # - ap-northeast-1 (Tokyo)
      # - ap-south-1 (Mumbai)
      # - sa-east-1 (São Paulo)
      #
      # URL pattern for any region:
      #   Transaction pooler: postgresql://postgres.[PROJECT_REF]:[PASSWORD]@aws-0-[REGION].pooler.supabase.com:6543/postgres
      #   Session pooler:     postgresql://postgres.[PROJECT_REF]:[PASSWORD]@aws-0-[REGION].pooler.supabase.com:5432/postgres
      #   Direct connection:  postgresql://postgres.[PROJECT_REF]:[PASSWORD]@db.[PROJECT_REF].supabase.co:5432/postgres
      #
      # Note: Replace [PROJECT_REF], [PASSWORD], and [REGION] with your actual values
      #
      # ============================================================================
      # URL ENCODING for Special Characters (CRITICAL)
      # ============================================================================
      # 
      # When embedding passwords in the connection URL, you MUST URL-encode special characters:
      #   @ → %40    # → %23    : → %3A    / → %2F    ? → %3F    & → %26
      #   = → %3D    + → %2B    $ → %24    ! → %21    * → %2A    ( → %28    ) → %29
      #
      # Example with special characters:
      #   Raw password: MyP@ss#123!
      #   URL-encoded:  MyP%40ss%23123%21
      #   Full URL:     postgresql://postgres.abc123:MyP%40ss%23123%21@aws-0-us-west-1.pooler.supabase.com:6543/postgres
      #
      # ============================================================================
      # COMMON MISTAKES TO AVOID
      # ============================================================================
      # 
      # ❌ Using direct database URL: db.YOUR_PROJECT_REF.supabase.co
      #    ✅ Use pooler URL instead: aws-0-eu-north-1.pooler.supabase.com
      #
      # ❌ Wrong port for transaction mode: 5432 when you need 6543
      #    ✅ Use 6543 for transaction pooling (recommended for web apps)
      #
      # ❌ Forgetting URL encoding: MyP@ss#123 in connection URL
      #    ✅ URL-encode the password: MyP%40ss%23123
      #
      # ❌ Using JDBC prefix: jdbc:postgresql://aws-0-us-west-1.pooler.supabase.com
      #    ✅ Use postgres:// or postgresql:// prefix (app converts to JDBC automatically)
      #
      # ❌ Connection pooling not enabled in Supabase settings
      #    ✅ Go to Supabase Dashboard → Project Settings → Database → Enable Pooler
      #
      # ❌ Using database name other than "postgres": /my_database
      #    ✅ Use /postgres (default Supabase database name)
      #
      # ❌ Inconsistent username format: postgres_user
      #    ✅ Use format: postgres.[PROJECT_REF] (e.g., postgres.abcdefghijklmnop)
      #
      # ❌ Wrong region in pooler URL (project is eu-north-1, URL says us-east-1)
      #    ✅ Always check your project region and use matching pooler URL
      #
      # ❌ Project paused due to inactivity (free tier auto-pauses after 7 days)
      #    ✅ Resume project in Supabase dashboard before deploying
      #
      # ============================================================================
      # VALIDATION EXAMPLES
      # ============================================================================
      # 
      # To verify your DATABASE_URL is correctly formatted, run these checks:
      #
      # 1. Test connection locally (PowerShell):
      #    $env:DATABASE_URL="postgresql://postgres.abc123:pass@aws-0-us-west-1.pooler.supabase.com:6543/postgres"
      #    .\mvn.ps1 spring-boot:run
      #    # Look for: "HikariPool-1 - Start completed"
      #
      # 2. Verify URL format with regex (PowerShell):
      #    $url = "postgresql://postgres.abc123:pass@aws-0-us-west-1.pooler.supabase.com:6543/postgres"
      #    if ($url -match '^postgresql://postgres\.[a-z0-9]+:.+@aws-[01]-[a-z0-9-]+\.pooler\.supabase\.com:(6543|5432)/postgres$') {
      #        Write-Host "✅ URL format is correct"
      #    } else {
      #        Write-Host "❌ URL format is incorrect"
      #    }
      #
      # 3. Test with psql (if PostgreSQL client installed):
      #    psql "postgresql://postgres.abc123:pass@aws-0-us-west-1.pooler.supabase.com:6543/postgres" -c "SELECT version();"
      #    # Should return PostgreSQL version info
      #
      # 4. Check URL encoding (PowerShell):
      #    # Correct: No raw special characters in password section
      #    if ($url -match '@[^@]*@') {
      #        Write-Host "❌ Password contains unencoded @ character"
      #    }
      #
      # 5. Verify in Render logs after deployment:
      #    # Success indicators:
      #    #   - "HikariPool-1 - Starting..."
      #    #   - "HikariPool-1 - Start completed"
      #    #   - "Started BackendApplication in X.XXX seconds"
      #    # Failure indicators:
      #    #   - "Connection to localhost:5432 refused" → DATABASE_URL not set
      #    #   - "password authentication failed" → Wrong password or encoding
      #    #   - "Connection timeout" → Wrong host/port or pooler not enabled
      #    #   - "Connection refused" → Project paused, billing issues, or pooler disabled
      #
      # ============================================================================
      
      # DATABASE_URL: Full PostgreSQL connection string using Supabase Connection Pooler
      # REQUIRED FORMAT: postgresql://postgres.[PROJECT_REF]:[YOUR-PASSWORD]@aws-1-[REGION].pooler.supabase.com:[PORT]/postgres
      # 
      # ============================================================================
      # DATABASE_URL SCHEME FORMAT - AUTOMATIC CONVERSION
      # ============================================================================
      # 
      # All database URLs should use the standard PostgreSQL "postgres://" or "postgresql://" scheme.
      # The application includes a lightweight URL converter that automatically transforms this to the
      # JDBC-compatible "jdbc:postgresql://" format at runtime.
      #
      # This conversion:
      # - Works automatically for both direct and pooler connections
      # - Requires no special configuration or handling
      # - Handles credential extraction and URL-encoding transparently
      # - Is format-agnostic: just copy the URL from Supabase dashboard
      #
      # ============================================================================
      # DIRECT CONNECTION FORMAT EXAMPLE
      # ============================================================================
      #
      # Use when you need direct database access (bypasses pooler):
      #
      # Format:
      #   postgres://user:password@db.PROJECT_REF.supabase.co:5432/postgres?sslmode=require
      #
      # Real-world example:
      #   postgres://postgres.abcd1234:MyS3cr3tP@ssw0rd@db.abcd1234.supabase.co:5432/postgres?sslmode=require
      #
      # Automatic conversion result (handled internally):
      #   jdbc:postgresql://db.abcd1234.supabase.co:5432/postgres?user=postgres.abcd1234&password=MyS3cr3tP%40ssw0rd&sslmode=require
      #
      # Components:
      #   - Scheme: postgres:// → automatically converted to jdbc:postgresql://
      #   - User: postgres.abcd1234
      #   - Password: MyS3cr3tP@ssw0rd → automatically URL-encoded to MyS3cr3tP%40ssw0rd
      #   - Host: db.abcd1234.supabase.co
      #   - Port: 5432 (standard PostgreSQL port)
      #   - Database: postgres
      #   - SSL: sslmode=require
      #
      # ============================================================================
      # TRANSACTION POOLER FORMAT EXAMPLE (RECOMMENDED)
      # ============================================================================
      #
      # Use for production to prevent connection exhaustion:
      #
      # Format:
      #   postgres://user:password@aws-0-REGION.pooler.supabase.com:6543/postgres?sslmode=require
      #
      # Real-world example:
      #   postgres://postgres.abcd1234:MyS3cr3tP@ssw0rd@aws-0-eu-north-1.pooler.supabase.com:6543/postgres?sslmode=require
      #
      # Automatic conversion result (handled internally):
      #   jdbc:postgresql://aws-0-eu-north-1.pooler.supabase.com:6543/postgres?user=postgres.abcd1234&password=MyS3cr3tP%40ssw0rd&sslmode=require
      #
      # Components:
      #   - Scheme: postgres:// → automatically converted to jdbc:postgresql://
      #   - User: postgres.abcd1234
      #   - Password: MyS3cr3tP@ssw0rd → automatically URL-encoded to MyS3cr3tP%40ssw0rd
      #   - Host: aws-0-eu-north-1.pooler.supabase.com
      #   - Port: 6543 (transaction pooler port)
      #   - Database: postgres
      #   - SSL: sslmode=require
      #
      # Regional variations (all use same format, just different region):
      #   EU North 1:      postgres://user:pass@aws-0-eu-north-1.pooler.supabase.com:6543/postgres
      #   EU North 1 (v2): postgres://user:pass@aws-1-eu-north-1.pooler.supabase.com:6543/postgres
      #   US East 1:       postgres://user:pass@aws-0-us-east-1.pooler.supabase.com:6543/postgres
      #   US East 1 (v2):  postgres://user:pass@aws-1-us-east-1.pooler.supabase.com:6543/postgres
      #   AP Southeast 1:  postgres://user:pass@aws-0-ap-southeast-1.pooler.supabase.com:6543/postgres
      #
      # ============================================================================
      # KEY INSIGHT: NO CONFIGURATION DIFFERENCES BETWEEN CONNECTION TYPES
      # ============================================================================
      #
      # The lightweight URL converter handles both direct and pooler connections identically:
      #
      # 1. Direct connection:
      #    Input:  postgres://user:pass@db.PROJECT_REF.supabase.co:5432/postgres
      #    Output: jdbc:postgresql://db.PROJECT_REF.supabase.co:5432/postgres?user=...&password=...
      #
      # 2. Transaction pooler:
      #    Input:  postgres://user:pass@aws-0-REGION.pooler.supabase.com:6543/postgres
      #    Output: jdbc:postgresql://aws-0-REGION.pooler.supabase.com:6543/postgres?user=...&password=...
      #
      # There are NO special settings, flags, or configuration differences between the two.
      # Simply copy the URL from Supabase dashboard and paste it - the conversion is automatic.
      #
      # ============================================================================
      # ⚠️ CRITICAL - PASSWORD ENCODING WARNING ⚠️
      # ============================================================================
      # 
      # PROVIDE PASSWORDS IN RAW, UNENCODED FORM ONLY!
      # 
      # The DatabaseUrlEnvironmentPostProcessor automatically handles URL encoding
      # of special characters in passwords. DO NOT manually URL-encode passwords
      # as this will cause DOUBLE-ENCODING and result in authentication failures
      # with the Supabase pooler connection.
      #
      # ❌ WRONG - Manually encoded password:
      #   Password: p@ssw0rd!
      #   DON'T USE: postgresql://postgres.abc:p%40ssw0rd%21@aws-1-eu-north-1.pooler.supabase.com:6543/postgres
      #   This causes double-encoding: p%40ssw0rd%21 → p%2540ssw0rd%2521 (FAILS!)
      #
      # ✅ CORRECT - Raw password (automatic encoding):
      #   Password: p@ssw0rd!
      #   USE THIS: postgresql://postgres.abc:p@ssw0rd!@aws-1-eu-north-1.pooler.supabase.com:6543/postgres
      #   The app automatically converts to: p%40ssw0rd%21 (WORKS!)
      #
      # ============================================================================
      # PASSWORD EXAMPLES:
      # ============================================================================
      #
      # Example 1 - Password with special characters:
      #   Raw password:     p@ssw0rd!
      #   What you enter:   postgresql://postgres.myproject:p@ssw0rd!@aws-1-eu-north-1.pooler.supabase.com:6543/postgres
      #   Auto-encoded to:  postgresql://postgres.myproject:p%40ssw0rd%21@aws-1-eu-north-1.pooler.supabase.com:6543/postgres
      #
      # Example 2 - Password without special characters:
      #   Raw password:     14863Faraj123
      #   What you enter:   postgresql://postgres.myproject:14863Faraj123@aws-1-eu-north-1.pooler.supabase.com:6543/postgres
      #   Auto-encoded to:  postgresql://postgres.myproject:14863Faraj123@aws-1-eu-north-1.pooler.supabase.com:6543/postgres
      #   (No encoding needed, stays the same)
      #
      # Example 3 - Complex password:
      #   Raw password:     MyP@ss#123!&=$
      #   What you enter:   postgresql://postgres.myproject:MyP@ss#123!&=$@aws-1-eu-north-1.pooler.supabase.com:6543/postgres
      #   Auto-encoded to:  postgresql://postgres.myproject:MyP%40ss%23123%21%26%3D%24@aws-1-eu-north-1.pooler.supabase.com:6543/postgres
      #
      # ============================================================================
      # URL COMPONENT BREAKDOWN:
      # ============================================================================
      #
      # Where:
      #   - [PROJECT_REF]: Your 16-character Supabase project reference (from dashboard)
      #   - [YOUR-PASSWORD]: Your actual password in RAW form (automatic encoding will be applied)
      #   - [REGION]: AWS region (e.g., eu-north-1, us-west-1, us-east-1, eu-central-1, ap-southeast-1)
      #   - [PORT]: 6543 for transaction mode (recommended) OR 5432 for session mode
      #
      # CURRENT CONFIGURATION:
      # - Using Supabase transaction pooler for eu-north-1 region (aws-1-eu-north-1.pooler.supabase.com)
      # - Port 6543: Transaction mode pooling - optimized for serverless environments like Render
      # - Transaction pooler handles connection pooling at the transaction level, ideal for web apps with many short-lived connections
      # - This pooler URL differs from direct database connections (db.YOUR_PROJECT_REF.supabase.co) and is specifically optimized for Render's stateless container architecture
      #
      # TO USE: Replace [YOUR-PASSWORD] with your actual Supabase database password IN RAW FORM (keep all other parts of the URL intact)
      - key: DATABASE_URL
        value: "postgresql://postgres.YOUR_PROJECT_REF:[YOUR-PASSWORD]@aws-1-eu-north-1.pooler.supabase.com:6543/postgres"
      
      # DATABASE_USER: PostgreSQL username for Supabase
      # REQUIRED FORMAT: postgres.[PROJECT_REF]
      # Example: postgres.abcdefghijklmnop
      # Note: Must match the username portion of your DATABASE_URL
      # CURRENT: Using postgres.YOUR_PROJECT_REF for eu-north-1 Supabase project
      - key: DATABASE_USER
        value: "postgres.YOUR_PROJECT_REF"
      
      # DATABASE_PASSWORD: PostgreSQL password (RAW, UNENCODED FORM ONLY)
      # ⚠️ WARNING: Provide your password in its original, raw form.
      # DO NOT manually URL-encode special characters.
      # 
      # Examples:
      #   ✅ CORRECT:   p@ssw0rd!          (raw password)
      #   ❌ WRONG:     p%40ssw0rd%21     (manually encoded - causes double-encoding!)
      #   ✅ CORRECT:   14863Faraj123      (raw password)
      #   ✅ CORRECT:   MyP@ss#123!&=$     (raw password with special chars)
      #   ❌ WRONG:     MyP%40ss%23123%21%26%3D%24 (manually encoded - FAILS!)
      #
      # This is your original password from Supabase project settings.
      # The DatabaseUrlEnvironmentPostProcessor handles encoding automatically.
      - key: DATABASE_PASSWORD
        value: "YOUR_DATABASE_PASSWORD"
      - key: DDL_AUTO
        value: "validate"
      
      # Supabase Configuration
      - key: SUPABASE_URL
        value: https://YOUR_PROJECT_REF.supabase.co
      - key: SUPABASE_ANON_KEY
        sync: true
      - key: SUPABASE_ROLE_KEY
        sync: true
      
      # Email Configuration
      - key: ADMIN_EMAIL
        sync: true
      - key: BREVO_API_KEY
        sync: true
      - key: BREVO_SMTP_SERVER
        value: smtp-relay.brevo.com
      - key: BREVO_SMTP_PORT
        value: "587"
      - key: BREVO_SMTP_USERNAME
        value: 96f5ae002@smtp-brevo.com
      - key: BREVO_SENDER_EMAIL
        value: noreply@odvsicilia.it
      - key: BREVO_SENDER_NAME
        value: ODV Sicilia
      
      # Application Configuration
      - key: FRONTEND_URL
        value: https://odvsicilia.it
      - key: BACKEND_URL
        value: https://odv-mfnu.onrender.com
      - key: H2_CONSOLE_ENABLED
        value: "false"
      
      # Build Configuration
      - key: DOCKERFILE_VARIANT
        value: "default"
      
      # ============================================================================
      # TROUBLESHOOTING DATABASE CONNECTIONS
      # ============================================================================
      # 
      # How to verify your environment variables in Render dashboard:
      # 1. Navigate to your service in Render dashboard
      # 2. Go to "Environment" tab
      # 3. Check that DATABASE_URL, DATABASE_USER, and DATABASE_PASSWORD are set
      # 4. Click "Show" next to each variable to verify the values
      # 5. Ensure DATABASE_URL has the correct format and URL-encoded password
      # 6. Ensure DATABASE_USER matches the username in DATABASE_URL
      # 7. Ensure DATABASE_PASSWORD is the raw password (NOT URL-encoded)
      #
      # What to look for in Render logs if connection fails:
      # 
      # SUCCESS indicators:
      #   - "HikariPool-1 - Start completed"
      #   - "Mapped \"{[/actuator/health]}\" onto public"
      #   - "Started BackendApplication in X.XXX seconds"
      #   - Health check endpoint returns 200 OK
      #
      # FAILURE indicators and solutions:
      #   
      #   Error: "Connection to localhost:5432 refused"
      #   → DATABASE_URL is not set or incorrectly formatted
      #   → Verify DATABASE_URL is set in Render environment variables
      #
      #   Error: "password authentication failed for user"
      #   → Password is incorrect or incorrectly encoded
      #   → Check that special characters in DATABASE_URL are URL-encoded
      #   → Verify DATABASE_PASSWORD matches your Supabase password exactly
      #
      #   Error: "FATAL: database does not exist"
      #   → Database name in URL is wrong (should be "postgres" for Supabase)
      #   → Verify the format: ...pooler.supabase.com:6543/postgres
      #
      #   Error: "Connection timeout" or "Connection refused"
      #   → Wrong host or port in DATABASE_URL
      #   → Verify you're using the correct Supabase pooler URL
      #   → Check if you're using port 6543 (transaction mode) or 5432 (session mode)
      #   → Ensure your Supabase project allows connections from external IPs
      #
      #   Error: "No suitable driver found for jdbc:postgres://"
      #   → DATABASE_URL should start with "postgres://" NOT "jdbc:postgresql://"
      #   → The application converts it automatically to JDBC format
      #
      # How to test your connection string locally:
      #   1. Copy your DATABASE_URL from Render
      #   2. Set it in your local .env file
      #   3. Run: .\mvn.ps1 spring-boot:run
      #   4. Check logs for successful HikariPool initialization
      #
      # Need more help?
      #   - Check Render logs: Dashboard → Your Service → Logs
      #   - Check Supabase connection info: Dashboard → Project Settings → Database
      #   - Verify network connectivity: https://supabase.com/docs/guides/platform/network-restrictions
      # ============================================================================

# Docker Registry Credentials for Docker Hub authentication
dockerRegistryCredentials:
  - registry: https://index.docker.io/v1/
    username:
      fromEnvVar: DOCKER_HUB_USERNAME
    password:
      fromEnvVar: DOCKER_HUB_PASSWORD

# No database service needed - using external Supabase database
