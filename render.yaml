services:
  # Backend Service - Java Spring Boot
  - type: web
    name: faraj-project-backend
    env: docker
    dockerfilePath: ./Dockerfile
    dockerRegistryCredential: 
      registry: https://index.docker.io/v1/
      username:
        fromEnvVar: DOCKER_HUB_USERNAME
      password:
        fromEnvVar: DOCKER_HUB_PASSWORD
    region: oregon
    healthCheckPath: /actuator/health
    # Using main Dockerfile with updated OpenJDK 17 base images (openjdk:17-jdk-slim and openjdk:17-jre-slim)
    envVars:
      # Spring Boot Configuration
      - key: SPRING_PROFILES_ACTIVE
        value: "prod"
      - key: PORT
        value: "8080"
      
      # ============================================================================
      # DATABASE CONFIGURATION - SUPABASE CONNECTION POOLER
      # ============================================================================
      # 
      # IMPORTANT: Always use Supabase Connection Pooler URLs (aws-0-[region].pooler.supabase.com)
      # NOT direct database URLs (db.[project-ref].supabase.co) for production deployments.
      #
      # Connection Pooler Modes:
      # 
      # 1. TRANSACTION MODE (Port 6543) - RECOMMENDED for most applications
      #    - Uses connection pooling at transaction level
      #    - Best for web applications with many short-lived connections
      #    - Format: postgres://postgres.[PROJECT_REF]:[PASSWORD]@aws-0-[REGION].pooler.supabase.com:6543/postgres
      #    - Example: postgres://postgres.abcdefghijklmnop:MyP%40ssw0rd@aws-0-us-west-1.pooler.supabase.com:6543/postgres
      #
      # 2. SESSION MODE (Port 5432) - Use for long-running connections or specific features
      #    - Uses connection pooling at session level
      #    - Required for certain PostgreSQL features (prepared statements, LISTEN/NOTIFY)
      #    - Format: postgres://postgres.[PROJECT_REF]:[PASSWORD]@aws-0-[REGION].pooler.supabase.com:5432/postgres
      #    - Example: postgres://postgres.abcdefghijklmnop:MyP%40ssw0rd@aws-0-us-west-1.pooler.supabase.com:5432/postgres
      #
      # URL ENCODING for Special Characters (CRITICAL):
      # When embedding passwords in the connection URL, you MUST URL-encode special characters:
      #   @ → %40    # → %23    : → %3A    / → %2F    ? → %3F    & → %26
      #   = → %3D    + → %2B    $ → %24    ! → %21    * → %2A    ( → %28    ) → %29
      #
      # Example with special characters:
      #   Raw password: MyP@ss#123!
      #   URL-encoded:  MyP%40ss%23123%21
      #   Full URL:     postgres://postgres.abc123:MyP%40ss%23123%21@aws-0-us-west-1.pooler.supabase.com:6543/postgres
      #
      # ============================================================================
      # COMMON MISTAKES TO AVOID:
      # ============================================================================
      # ❌ Using direct database URL: db.pejuystijjkjxjctieyb.supabase.co
      #    ✅ Use pooler URL instead: aws-0-us-west-1.pooler.supabase.com
      #
      # ❌ Wrong port for transaction mode: 5432 when you need 6543
      #    ✅ Use 6543 for transaction pooling (recommended for web apps)
      #
      # ❌ Forgetting URL encoding: MyP@ss#123 in connection URL
      #    ✅ URL-encode the password: MyP%40ss%23123
      #
      # ❌ Using JDBC prefix: jdbc:postgresql://aws-0-us-west-1.pooler.supabase.com
      #    ✅ Use postgres:// prefix (app converts to JDBC automatically)
      #
      # ❌ Connection pooling not enabled in Supabase settings
      #    ✅ Go to Supabase Dashboard → Project Settings → Database → Enable Pooler
      #
      # ❌ Using database name other than "postgres": /my_database
      #    ✅ Use /postgres (default Supabase database name)
      #
      # ❌ Inconsistent username format: postgres_user
      #    ✅ Use format: postgres.[PROJECT_REF] (e.g., postgres.abcdefghijklmnop)
      #
      # ============================================================================
      # VALIDATION EXAMPLES:
      # ============================================================================
      # 
      # To verify your DATABASE_URL is correctly formatted, run these checks:
      #
      # 1. Test connection locally (PowerShell):
      #    $env:DATABASE_URL="postgres://postgres.abc123:pass@aws-0-us-west-1.pooler.supabase.com:6543/postgres"
      #    .\mvn.ps1 spring-boot:run
      #    # Look for: "HikariPool-1 - Start completed"
      #
      # 2. Verify URL format with regex (PowerShell):
      #    $url = "postgres://postgres.abc123:pass@aws-0-us-west-1.pooler.supabase.com:6543/postgres"
      #    if ($url -match '^postgres://postgres\.[a-z0-9]+:.+@aws-0-[a-z0-9-]+\.pooler\.supabase\.com:(6543|5432)/postgres$') {
      #        Write-Host "✅ URL format is correct"
      #    } else {
      #        Write-Host "❌ URL format is incorrect"
      #    }
      #
      # 3. Test with psql (if PostgreSQL client installed):
      #    psql "postgres://postgres.abc123:pass@aws-0-us-west-1.pooler.supabase.com:6543/postgres" -c "SELECT version();"
      #    # Should return PostgreSQL version info
      #
      # 4. Check URL encoding (PowerShell):
      #    # Correct: No raw special characters in password section
      #    if ($url -match '@[^@]*@') {
      #        Write-Host "❌ Password contains unencoded @ character"
      #    }
      #
      # 5. Verify in Render logs after deployment:
      #    # Success indicators:
      #    #   - "HikariPool-1 - Starting..."
      #    #   - "HikariPool-1 - Start completed"
      #    #   - "Started BackendApplication in X.XXX seconds"
      #    # Failure indicators:
      #    #   - "Connection to localhost:5432 refused" → DATABASE_URL not set
      #    #   - "password authentication failed" → Wrong password or encoding
      #    #   - "Connection timeout" → Wrong host/port or pooler not enabled
      #
      # ============================================================================
      
      # DATABASE_URL: Full PostgreSQL connection string using Supabase Connection Pooler
      # REQUIRED FORMAT: postgresql://postgres.[PROJECT_REF]:[YOUR-PASSWORD]@aws-1-[REGION].pooler.supabase.com:[PORT]/postgres
      # 
      # IMPORTANT - PASSWORD HANDLING:
      # Insert your actual password directly as-is in the [YOUR-PASSWORD] section.
      # DO NOT manually URL-encode special characters in your password.
      # The DatabaseUrlEnvironmentPostProcessor will automatically handle encoding of special characters
      # (such as @, #, :, /, ?, &, =, +, $, !, *, (, )) for you.
      #
      # Example with special characters in password:
      #   Raw password: MyP@ss#123!
      #   Insert as-is:  postgresql://postgres.pejuystijjkjxjctieyb:MyP@ss#123!@aws-1-eu-north-1.pooler.supabase.com:6543/postgres
      #   The application will automatically convert it to the properly encoded format.
      #
      # Where:
      #   - [PROJECT_REF]: Your 16-character Supabase project reference (from dashboard)
      #   - [YOUR-PASSWORD]: Your actual password as-is (automatic encoding will be applied)
      #   - [REGION]: AWS region (e.g., eu-north-1, us-west-1, us-east-1, eu-central-1, ap-southeast-1)
      #   - [PORT]: 6543 for transaction mode (recommended) OR 5432 for session mode
      #
      # CURRENT CONFIGURATION:
      # - Using Supabase transaction pooler for eu-north-1 region (aws-1-eu-north-1.pooler.supabase.com)
      # - Port 6543: Transaction mode pooling - optimized for serverless environments like Render
      # - Transaction pooler handles connection pooling at the transaction level, ideal for web apps with many short-lived connections
      # - This pooler URL differs from direct database connections (db.pejuystijjkjxjctieyb.supabase.co) and is specifically optimized for Render's stateless container architecture
      #
      # TO USE: Replace [YOUR-PASSWORD] with your actual Supabase database password (keep all other parts of the URL intact)
      - key: DATABASE_URL
        value: "postgresql://postgres.pejuystijjkjxjctieyb:[YOUR-PASSWORD]@aws-1-eu-north-1.pooler.supabase.com:6543/postgres"
      
      # DATABASE_USER: PostgreSQL username for Supabase
      # REQUIRED FORMAT: postgres.[PROJECT_REF]
      # Example: postgres.abcdefghijklmnop
      # Note: Must match the username portion of your DATABASE_URL
      # CURRENT: Using postgres.pejuystijjkjxjctieyb for eu-north-1 Supabase project
      - key: DATABASE_USER
        value: "postgres.pejuystijjkjxjctieyb"
      
      # DATABASE_PASSWORD: PostgreSQL password (RAW, NOT URL-encoded)
      # This is your original password from Supabase project settings.
      # Use raw password here: MyP@ssw0rd (NOT MyP%40ssw0rd)
      # URL encoding is ONLY needed when embedding password in DATABASE_URL.
      # Example: MyP@ss#123! (with special characters as-is)
      - key: DATABASE_PASSWORD
        value: "YOUR_DATABASE_PASSWORD"
      - key: DDL_AUTO
        value: "validate"
      
      # Supabase Configuration
      - key: SUPABASE_URL
        value: https://pejuystijjkjxjctieyb.supabase.co
      - key: SUPABASE_ANON_KEY
        sync: true
      - key: SUPABASE_ROLE_KEY
        sync: true
      
      # Email Configuration
      - key: ADMIN_EMAIL
        sync: true
      - key: BREVO_API_KEY
        sync: true
      - key: BREVO_SMTP_SERVER
        value: smtp-relay.brevo.com
      - key: BREVO_SMTP_PORT
        value: "587"
      - key: BREVO_SMTP_USERNAME
        value: 96f5ae002@smtp-brevo.com
      - key: BREVO_SENDER_EMAIL
        value: noreply@odvsicilia.it
      - key: BREVO_SENDER_NAME
        value: ODV Sicilia
      
      # Application Configuration
      - key: FRONTEND_URL
        value: https://odvsicilia.it
      - key: BACKEND_URL
        value: https://odv-mfnu.onrender.com
      - key: H2_CONSOLE_ENABLED
        value: "false"
      
      # Build Configuration
      - key: DOCKERFILE_VARIANT
        value: "default"
      
      # ============================================================================
      # TROUBLESHOOTING DATABASE CONNECTIONS
      # ============================================================================
      # 
      # How to verify your environment variables in Render dashboard:
      # 1. Navigate to your service in Render dashboard
      # 2. Go to "Environment" tab
      # 3. Check that DATABASE_URL, DATABASE_USER, and DATABASE_PASSWORD are set
      # 4. Click "Show" next to each variable to verify the values
      # 5. Ensure DATABASE_URL has the correct format and URL-encoded password
      # 6. Ensure DATABASE_USER matches the username in DATABASE_URL
      # 7. Ensure DATABASE_PASSWORD is the raw password (NOT URL-encoded)
      #
      # What to look for in Render logs if connection fails:
      # 
      # SUCCESS indicators:
      #   - "HikariPool-1 - Start completed"
      #   - "Mapped \"{[/actuator/health]}\" onto public"
      #   - "Started BackendApplication in X.XXX seconds"
      #   - Health check endpoint returns 200 OK
      #
      # FAILURE indicators and solutions:
      #   
      #   Error: "Connection to localhost:5432 refused"
      #   → DATABASE_URL is not set or incorrectly formatted
      #   → Verify DATABASE_URL is set in Render environment variables
      #
      #   Error: "password authentication failed for user"
      #   → Password is incorrect or incorrectly encoded
      #   → Check that special characters in DATABASE_URL are URL-encoded
      #   → Verify DATABASE_PASSWORD matches your Supabase password exactly
      #
      #   Error: "FATAL: database does not exist"
      #   → Database name in URL is wrong (should be "postgres" for Supabase)
      #   → Verify the format: ...pooler.supabase.com:6543/postgres
      #
      #   Error: "Connection timeout" or "Connection refused"
      #   → Wrong host or port in DATABASE_URL
      #   → Verify you're using the correct Supabase pooler URL
      #   → Check if you're using port 6543 (transaction mode) or 5432 (session mode)
      #   → Ensure your Supabase project allows connections from external IPs
      #
      #   Error: "No suitable driver found for jdbc:postgres://"
      #   → DATABASE_URL should start with "postgres://" NOT "jdbc:postgresql://"
      #   → The application converts it automatically to JDBC format
      #
      # How to test your connection string locally:
      #   1. Copy your DATABASE_URL from Render
      #   2. Set it in your local .env file
      #   3. Run: .\mvn.ps1 spring-boot:run
      #   4. Check logs for successful HikariPool initialization
      #
      # Need more help?
      #   - Check Render logs: Dashboard → Your Service → Logs
      #   - Check Supabase connection info: Dashboard → Project Settings → Database
      #   - Verify network connectivity: https://supabase.com/docs/guides/platform/network-restrictions
      # ============================================================================

# Docker Registry Credentials for Docker Hub authentication
dockerRegistryCredentials:
  - registry: https://index.docker.io/v1/
    username:
      fromEnvVar: DOCKER_HUB_USERNAME
    password:
      fromEnvVar: DOCKER_HUB_PASSWORD

# No database service needed - using external Supabase database

